<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hells Balls — 3D Physics Bowling</title>
<meta name="description" content="Hells Balls is an original motion-controlled 3D physics bowling game: a real rigid-body simulation, USBC ten-frame scoring, six game modes, mouse and webcam input.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05060f; overflow: hidden;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #f5f5fc;
  }
  #viewport {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 700px at 50% 0%, #12143c 0%, #05060f 70%);
  }
  /* The game is a game, not a document: a drag on the stage aims the shot and
     throws the ball, so it must never highlight HUD text. Real text fields
     (player names, trivia/equation answers) opt back in below. */
  #stage, #ui-root, #canvas-host {
    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
  }
  #stage input, #stage textarea, #stage select,
  #stage [contenteditable="true"], #stage .allow-select {
    user-select: text;
    -webkit-user-select: text;
  }
  /* Drags on the lane are aiming/throws: no browser panning or zoom gestures.
     Scrolling containers (How to Play) keep their own touch behaviour. */
  #canvas-host, #canvas-host canvas { touch-action: none; }
  #stage {
    position: relative; width: 1280px; height: 720px;
    /* Never let flex shrink the box: the stage is scaled as a whole to fit
       the window (see App._fitStage), so its layout size stays 1280x720. */
    flex: none;
    transform-origin: center center;
    background: #0c0e2c; overflow: hidden;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7);
  }
  #canvas-host { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  #canvas-host canvas { display: block; width: 1280px !important; height: 720px !important; }
  #ui-root { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  .ui-label, .ui-button, .screen, .hud, .overlay { font-family: inherit; }
  .ui-button { transition: filter 0.08s ease; }
  .screen { pointer-events: auto; }
  /* Boot notice: visible until src/main.js takes over, and left on screen with a
     readable explanation if a module (the CDN copy of three.js, most likely)
     fails to load, instead of a blank stage. */
  #loading {
    position: absolute; left: 0; top: 0; width: 1280px; height: 720px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; z-index: 999;
  }
  #loading .boot-title { font-size: 22px; font-weight: 800; letter-spacing: 4px; color: #96eeff; }
  #loading .boot-note { font-size: 15px; line-height: 1.6; max-width: 720px; color: #cfcbea; white-space: pre-wrap; }
  #loading .boot-note[hidden] { display: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js"
  }
}
</script>
<script>
  // If the module graph cannot load there is no game to show, so say so.
  (function () {
    var note = null;
    function explain(message) {
      if (!note) note = document.querySelector('#loading .boot-note');
      if (!note) return;
      note.hidden = false;
      note.textContent = String(message);
    }
    window.addEventListener('error', function (event) {
      var target = event && event.target;
      if (target && target.tagName === 'SCRIPT') explain('Could not load ' + (target.src || 'a script') + '.');
      else if (event && event.message) explain(event.message);
    }, true);
    window.addEventListener('unhandledrejection', function (event) {
      var reason = event && event.reason;
      explain((reason && (reason.message || reason)) || 'The game failed to start.');
    });
  }());
</script>
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <div id="canvas-host"></div>
      <div id="ui-root"></div>
      <div id="loading">
        <div class="boot-title">HELLS BALLS</div>
        <div class="boot-note" hidden></div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
